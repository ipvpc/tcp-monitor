name: tcp-monitor

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcpmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcpmon}
      POSTGRES_DB: ${POSTGRES_DB:-tcpmon}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcpmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcpmon}
      POSTGRES_DB: ${POSTGRES_DB:-tcpmon}
      POSTGRES_HOST: db
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      PROBE_CONCURRENCY: ${PROBE_CONCURRENCY:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

